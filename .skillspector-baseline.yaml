version: 2

rules:
  - id: "PE3"
    message: "*access token*"
    reason: "Wording only. The skill names token types and matches error text such as 'access token invalid'. It never reads credential files. SkillSpector's LLM review disagreed with every PE3 finding."
  - id: "MP2"
    message: "*fill window*"
    reason: "False positive. 'Fill window' is a Meta Marketing reporting parameter, not agent memory or state."
  - id: "SQP-1"
    reason: "Every trigger phrase is anchored on Omnata in the SKILL.md and reference descriptions. SkillSpector's LLM review disagreed with every SQP-1 finding."
  - id: "SQP-3"
    message: "*plain language*"
    reason: "'In plain language' means non-technical wording, not a language or locale override. SkillSpector's LLM review called it an acceptable idiom."
  - id: "SDI-4"
    path: "*sync-management.md"
    message: "*CANCEL_SYNC_RUN*"
    reason: "Contradictory finding. An earlier scan asked for CANCEL_SYNC_RUN in the Quick reference; it's listed there as not granted to customer roles, which matches the body text."
  - id: "SDI-4"
    path: "*configure-connections.md"
    message: "*network rule*"
    reason: "No contradiction. The plugin creates the network rules from the approved specification; CoCo doesn't. Credentials go only to those addresses. SkillSpector's LLM review disagreed."
  - id: "SQP-3"
    path: "*google_sheets.md"
    reason: "Masking client secrets in output is a credential-hygiene rule, not a language or output policy. SkillSpector's LLM review disagreed."
